name: Terraform Destroy

# Manual-only, never on push/pull_request — a destroy pipeline that can fire
# automatically is one bad trigger away from tearing down production.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-rtrp" to confirm — this tears down real infrastructure'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Confirm Destroy Intent
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy-rtrp" ]; then
            echo "Confirmation phrase did not match 'destroy-rtrp'. Aborting."
            exit 1
          fi

  # Order matters here, for two separate reasons that both point the same way:
  #
  # 1. Remote-state reads. ecs reads messaging/database/cache/alerting's
  #    outputs (broker endpoint, postgres host, redis host, SNS topic ARN),
  #    and messaging/database/cache read ecs's outputs right back (security
  #    group IDs, since M4 widened them for ML Inference and Alerting). Every
  #    one of those reads is wrapped in try(...) with a placeholder fallback
  #    (see infra/ecs/backend.tf, infra/messaging/main.tf,
  #    infra/database/main.tf, infra/cache/main.tf, infra/dns/main.tf), so a
  #    module whose remote state has already gone empty no longer breaks the
  #    module reading it. That removes the Terraform-side ordering
  #    constraint entirely — this pipeline used to deadlock here, the first
  #    time it was actually run end to end.
  #
  # 2. AWS-side physical constraints, which try() can't fix because they're
  #    not a Terraform problem: postgres-sg, redis-sg, and rabbitmq-sg's
  #    ingress rules reference ecs's security groups as allowed peers, and
  #    AWS refuses to delete a security group that's still referenced by
  #    another one's rule (DependencyViolation). Same story with the ACM
  #    certificate — it can't be deleted while the ALB's HTTPS listener
  #    (owned by ecs) still references it. Both resolve the same way:
  #    destroy messaging/database/cache before ecs, and destroy dns after
  #    ecs, not before.
  #
  # cicd is always last — it's the OIDC role this whole workflow runs as.
  # bootstrap is never touched here — it's the state backend itself.
  destroy-messaging:
    name: Destroy messaging
    needs: guard
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/messaging
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-database:
    name: Destroy database
    needs: guard
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/database
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-cache:
    name: Destroy cache
    needs: guard
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/cache
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-alerting:
    name: Destroy alerting
    needs: guard
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/alerting
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-ecr:
    name: Destroy ecr
    needs: guard
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - name: Force-delete ECR repositories directly
        # Belt and suspenders: force_delete = true on the aws_ecr_repository
        # resources should make `terraform destroy` empty these itself, but
        # that depends on Terraform's state already tracking force_delete as
        # true, which a prior apply run without that line in the config can
        # silently reset. A repository still holding images fails
        # `terraform destroy` outright (RepositoryNotEmptyException), so
        # this step removes that failure mode entirely rather than trusting
        # Terraform state to have the right value.
        run: |
          for repo in rtrp-trade-api rtrp-risk-engine rtrp-grafana rtrp-alerting rtrp-ml-inference rtrp-prometheus; do
            aws ecr delete-repository --repository-name "$repo" --force --region eu-north-1 || true
          done
      - working-directory: infra/ecr
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-ecs:
    name: Destroy ecs
    needs: [destroy-messaging, destroy-database, destroy-cache, destroy-alerting]
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/ecs
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-dns:
    name: Destroy dns
    needs: destroy-ecs
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/dns
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-vpc:
    name: Destroy vpc
    needs: destroy-dns
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/vpc
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve

  destroy-cicd:
    name: Destroy cicd (always last — see comment above)
    needs: destroy-vpc
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::026703081738:role/rtrp-github-ci-role
          aws-region: eu-north-1
      - working-directory: infra/cicd
        run: |
          terraform init -input=false
          terraform destroy -input=false -auto-approve
